<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caixa de Entrada — Gente & Cultura</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --border2: #ccc7bf;
    --text: #1a1916;
    --text2: #6b6760;
    --text3: #9e9b96;
    --accent: #1a1916;
    --accent-fg: #ffffff;
    --success-bg: #eaf3de;
    --success-fg: #3b6d11;
    --danger-bg: #fcebeb;
    --danger-fg: #a32d2d;
    --info-fg: #185fa5;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1rem 4rem;
  }

  header {
    width: 100%;
    max-width: 600px;
    margin-bottom: 2rem;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text2);
    margin-top: 8px;
    line-height: 1.6;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    width: 100%;
    max-width: 600px;
  }

  .config-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1.25rem;
    margin-bottom: 1.25rem;
    display: none;
  }

  .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }

  input[type=text], input[type=password], textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type=text]:focus, input[type=password]:focus, textarea:focus {
    border-color: var(--border2);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
  }

  textarea { min-height: 88px; resize: vertical; line-height: 1.6; }

  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 20px; }

  .field-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; display: block; }

  .btn-config {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    color: var(--text2); background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 7px 14px; cursor: pointer; margin-bottom: 1.25rem;
    transition: background 0.15s, color 0.15s;
  }
  .btn-config:hover { background: var(--border); color: var(--text); }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: var(--radius-sm);
    padding: 11px 22px; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: var(--text2); margin-top: 1rem;
    min-height: 28px;
  }

  .spinner {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 2px solid var(--border); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-top: 1.25rem;
    width: 100%;
    max-width: 600px;
    display: none;
  }

  .result-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; padding: 4px 12px;
    border-radius: 20px;
  }
  .badge-success { background: var(--success-bg); color: var(--success-fg); }
  .badge-danger { background: var(--danger-bg); color: var(--danger-fg); }

  .result-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 14px; }

  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  .section-label {
    font-size: 11px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 6px;
  }

  .section-body { font-size: 14px; color: var(--text); line-height: 1.7; margin-bottom: 14px; }

  ol { padding-left: 18px; }
  ol li { font-size: 14px; color: var(--text); line-height: 1.8; }

  .link-clickup {
    font-size: 13px; color: var(--info-fg); text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .link-clickup:hover { text-decoration: underline; }

  .note { font-size: 12px; color: var(--text3); margin-top: 10px; }

  .icon { width: 16px; height: 16px; display: inline-block; vertical-align: middle; }

  @media (max-width: 480px) {
    .config-grid { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <p class="eyebrow">Gente &amp; Cultura</p>
  <h1>Caixa de entrada</h1>
  <p class="subtitle">Descreva sua demanda em uma frase. A IA estrutura em tarefa e envia direto para o ClickUp.</p>
</header>

<div class="card">
  <button class="btn-config" id="toggle-btn" onclick="toggleConfig()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span id="toggle-label">Configurar API</span>
  </button>

  <div class="config-card" id="config-section">
    <div class="config-grid">
      <div>
        <label for="api-token">ClickUp API Token</label>
        <input type="password" id="api-token" placeholder="pk_..." />
      </div>
      <div>
        <label for="list-id">ID da lista "Pendente"</label>
        <input type="text" id="list-id" placeholder="901327XXXXXX" />
      </div>
    </div>
    <p class="note">As credenciais ficam salvas apenas neste navegador e nunca são enviadas a terceiros.</p>
  </div>

  <div class="field">
    <label class="field-title" for="demand-text">O que precisa ser feito?</label>
    <textarea id="demand-text" placeholder="Ex: Criar relatório de indicadores de RH do trimestre..."></textarea>
  </div>

  <div class="field">
    <label class="field-title" for="assignee">Para quem?</label>
    <input type="text" id="assignee" placeholder="Nome do responsável..." />
  </div>

  <button class="btn-primary" id="generate-btn" onclick="generateTask()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
    Gerar e enviar ao ClickUp
  </button>

  <div class="status" id="status-area"></div>
</div>

<div class="result" id="result-area"></div>

<script>
  // Persist config in localStorage
  window.addEventListener('DOMContentLoaded', function() {
    var t = localStorage.getItem('cu_token');
    var l = localStorage.getItem('cu_list');
    if (t) document.getElementById('api-token').value = t;
    if (l) document.getElementById('list-id').value = l;
  });

  function saveConfig() {
    var t = document.getElementById('api-token').value.trim();
    var l = document.getElementById('list-id').value.trim();
    if (t) localStorage.setItem('cu_token', t);
    if (l) localStorage.setItem('cu_list', l);
  }

  function toggleConfig() {
    var s = document.getElementById('config-section');
    var label = document.getElementById('toggle-label');
    if (s.style.display === 'none' || s.style.display === '') {
      s.style.display = 'block';
      label.textContent = 'Fechar configurações';
    } else {
      saveConfig();
      s.style.display = 'none';
      label.textContent = 'Configurar API';
    }
  }

  function setStatus(msg, type) {
    var el = document.getElementById('status-area');
    if (!msg) { el.innerHTML = ''; return; }
    var icon = '';
    if (type === 'loading') icon = '<div class="spinner"></div>';
    if (type === 'error') icon = '<svg class="icon" style="flex-shrink:0;color:#a32d2d;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    el.innerHTML = icon + '<span>' + msg + '</span>';
  }

  async function generateTask() {
    var demand = document.getElementById('demand-text').value.trim();
    var assignee = document.getElementById('assignee').value.trim();
    var token = document.getElementById('api-token').value.trim();
    var listId = document.getElementById('list-id').value.trim();

    if (!demand) { setStatus('Descreva a demanda antes de continuar.', 'error'); return; }
    if (!assignee) { setStatus('Informe para quem é a demanda.', 'error'); return; }
    if (!token || !listId) {
      document.getElementById('config-section').style.display = 'block';
      document.getElementById('toggle-label').textContent = 'Fechar configurações';
      setStatus('Configure o token e o ID da lista acima.', 'error');
      return;
    }

    saveConfig();
    document.getElementById('generate-btn').disabled = true;
    document.getElementById('result-area').style.display = 'none';
    setStatus('Gerando estrutura da tarefa com IA...', 'loading');

    var generated;
    try {
      var aiRes = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: 'Você é um assistente de gestão de pessoas e projetos. A partir da frase abaixo, gere uma tarefa estruturada para o time de Gente & Cultura.\n\nDemanda: "' + demand + '"\nResponsável sugerido: ' + assignee + '\n\nResponda SOMENTE em JSON válido, sem texto extra, sem markdown, neste formato exato:\n{\n  "titulo": "Título curto e claro da tarefa (máx 60 caracteres)",\n  "descricao": "Descrição completa explicando o contexto e o objetivo",\n  "proximos_passos": ["passo 1", "passo 2", "passo 3"],\n  "responsavel": "Nome do responsável conforme indicado"\n}'
          }]
        })
      });
      var aiData = await aiRes.json();
      var raw = '';
      for (var i = 0; i < aiData.content.length; i++) {
        if (aiData.content[i].type === 'text') { raw = aiData.content[i].text; break; }
      }
      generated = JSON.parse(raw.replace(/```json|```/g, '').trim());
    } catch(e) {
      setStatus('Erro ao gerar a tarefa com IA. Tente novamente.', 'error');
      document.getElementById('generate-btn').disabled = false;
      return;
    }

    setStatus('Enviando tarefa ao ClickUp...', 'loading');

    var descBody = generated.descricao +
      '\n\nResponsável: ' + generated.responsavel +
      '\n\nPróximos passos:\n' + generated.proximos_passos.map(function(p,i){ return (i+1) + '. ' + p; }).join('\n');

    var taskUrl = '';
    var cuOk = true;
    try {
      var cuRes = await fetch('https://api.clickup.com/api/v2/list/' + listId + '/task', {
        method: 'POST',
        headers: { 'Authorization': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: generated.titulo, description: descBody })
      });
      var cuData = await cuRes.json();
      if (!cuRes.ok) throw new Error(cuData.err || 'Erro desconhecido');
      taskUrl = cuData.url || '';
    } catch(e) {
      cuOk = false;
      setStatus('Tarefa gerada, mas falha ao enviar ao ClickUp: ' + e.message, 'error');
    }

    document.getElementById('generate-btn').disabled = false;
    if (cuOk) setStatus('', '');

    var steps = generated.proximos_passos.map(function(s){ return '<li>' + s + '</li>'; }).join('');
    var linkHtml = taskUrl ? '<a class="link-clickup" href="' + taskUrl + '" target="_blank"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Ver no ClickUp</a>' : '';
    var badgeClass = cuOk ? 'badge-success' : 'badge-danger';
    var badgeText = cuOk ? '✓ Tarefa criada no ClickUp' : '⚠ Tarefa gerada (erro no envio)';

    var el = document.getElementById('result-area');
    el.innerHTML =
      '<div class="result-header"><span class="badge ' + badgeClass + '">' + badgeText + '</span>' + linkHtml + '</div>' +
      '<div class="result-title">' + generated.titulo + '</div>' +
      '<hr>' +
      '<div class="section-label">Descrição</div>' +
      '<div class="section-body">' + generated.descricao + '</div>' +
      '<div class="section-label">Próximos passos</div>' +
      '<ol style="margin-bottom:14px;">' + steps + '</ol>' +
      '<div class="section-label">Responsável</div>' +
      '<div class="section-body" style="margin-bottom:0;">' + generated.responsavel + '</div>';
    el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });

    document.getElementById('demand-text').value = '';
    document.getElementById('assignee').value = '';
    document.getElementById('demand-text').focus();
  }
</script>
</body>
</html>
