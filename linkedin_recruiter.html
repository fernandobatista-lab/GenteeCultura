<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LinkedIn Recruiter — Busca por IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --surface3: #1e1e28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --accent: #0a84ff;
    --accent2: #30d158;
    --accent3: #ffd60a;
    --text: #f0f0f5;
    --text2: #8e8e9a;
    --text3: #55555f;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(10,132,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* Header */
  header {
    padding: 48px 0 40px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 20px; height: 20px; fill: white; }

  .logo-text {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .logo-text span { color: var(--accent); }

  .pill-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    background: rgba(10,132,255,0.15);
    color: var(--accent);
    border: 1px solid rgba(10,132,255,0.3);
    border-radius: 20px;
    letter-spacing: 0.04em;
    margin-top: 4px;
    display: inline-block;
  }

  /* Steps */
  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 36px;
  }

  .step-dot {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--surface3);
    transition: background 0.4s;
  }

  .step-dot.active { background: var(--accent); }
  .step-dot.done { background: var(--accent2); }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }

  .card:focus-within { border-color: var(--border2); }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
  }

  textarea, input, select {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.7;
    resize: none;
  }

  textarea::placeholder, input::placeholder { color: var(--text3); }
  select option { background: #1e1e28; color: var(--text); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

  /* Main button */
  .btn-primary {
    width: 100%;
    padding: 14px 20px;
    background: var(--accent);
    color: white;
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: -0.01em;
  }

  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    padding: 9px 16px;
    background: var(--surface2);
    color: var(--text2);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .btn-secondary:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }

  /* Sections */
  .section-title {
    font-family: var(--font-head);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .section-sub {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 28px;
  }

  /* Loading */
  .loader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 0;
    gap: 16px;
  }

  .loader-ring {
    width: 48px;
    height: 48px;
    border: 3px solid var(--surface3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-size: 14px;
    color: var(--text2);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

  /* Tags */
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 3px 9px;
    background: var(--surface3);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 2px;
    font-weight: 400;
  }

  /* Boolean query */
  .boolean-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: 'DM Sans', monospace;
    font-size: 12.5px;
    color: var(--accent);
    word-break: break-word;
    line-height: 1.7;
    position: relative;
  }

  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: color 0.15s;
  }

  .copy-btn:hover { color: var(--text); }

  /* Result header */
  .result-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Profile cards */
  .profile-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 8px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: border-color 0.2s, background 0.2s;
    animation: fadeUp 0.3s ease both;
  }

  .profile-card:hover { border-color: var(--border2); background: var(--surface2); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .avatar.blue { background: rgba(10,132,255,0.15); color: var(--accent); }
  .avatar.green { background: rgba(48,209,88,0.15); color: var(--accent2); }
  .avatar.amber { background: rgba(255,214,10,0.12); color: var(--accent3); }

  .profile-info { flex: 1; min-width: 0; }

  .profile-name {
    font-family: var(--font-head);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .li-link {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid rgba(10,132,255,0.25);
    border-radius: 4px;
    padding: 1px 7px;
    transition: background 0.15s;
  }

  .li-link:hover { background: rgba(10,132,255,0.1); }

  .profile-title {
    font-size: 13px;
    color: var(--text2);
    margin: 1px 0 6px;
  }

  .profile-reason {
    font-size: 12px;
    color: var(--text3);
    margin-bottom: 6px;
    font-style: italic;
  }

  .score-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    flex-shrink: 0;
  }

  .score-num {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .score-num.hi { color: var(--accent2); }
  .score-num.mid { color: var(--accent); }
  .score-num.lo { color: var(--accent3); }

  .score-bar {
    width: 64px;
    height: 4px;
    background: var(--surface3);
    border-radius: 2px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  .score-label {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Page sections */
  .page { display: none; }
  .page.active { display: block; }

  /* Responsive */
  @media (max-width: 500px) {
    .grid2 { grid-template-columns: 1fr; }
    header { padding: 32px 0 28px; flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M20 6H4a2 2 0 00-2 2v8a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2zM4 8h4v8H4V8zm6 0h4v8h-4V8zm6 0h4v8h-4V8z" opacity="0"/><path d="M16 7a5 5 0 11-6.9 7.2A5 5 0 0116 7zM8 6a6 6 0 100 12A6 6 0 008 6zM21 19l-4.35-4.35"/><circle cx="9" cy="9" r="5"/><path d="M15 15l5 5"/></svg>
        <svg viewBox="0 0 24 24" style="position:absolute;width:20px;height:20px;">
          <circle cx="11" cy="11" r="6" fill="none" stroke="white" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">recruiter<span>AI</span></div>
        <div class="pill-badge">powered by Claude</div>
      </div>
    </div>
  </header>

  <div class="steps" id="steps">
    <div class="step-dot active" id="sd1"></div>
    <div class="step-dot" id="sd2"></div>
    <div class="step-dot" id="sd3"></div>
  </div>

  <!-- PAGE 1: Input -->
  <div class="page active" id="page1">
    <p class="section-title">Descreva a vaga</p>
    <p class="section-sub">Cole os requisitos, descrição ou perfil do candidato ideal.</p>

    <div class="card">
      <label class="field-label" for="jd">Descrição / Requisitos da vaga</label>
      <textarea id="jd" rows="9" placeholder="Ex: Buscamos engenheiro de dados sênior com 5+ anos de experiência em Python, Apache Spark e Databricks. Domínio de SQL avançado, experiência com pipelines de dados em cloud (AWS ou GCP) e conhecimento em dbt. Inglês intermediário. Regime híbrido, São Paulo."></textarea>
    </div>

    <div class="grid2">
      <div class="card" style="margin-bottom:0;">
        <label class="field-label" for="qty">Número de perfis</label>
        <select id="qty">
          <option value="5">5 candidatos</option>
          <option value="10" selected>10 candidatos</option>
          <option value="15">15 candidatos</option>
          <option value="20">20 candidatos</option>
        </select>
      </div>
      <div class="card" style="margin-bottom:0;">
        <label class="field-label" for="loc">Localização</label>
        <input id="loc" type="text" placeholder="Ex: São Paulo, SP" />
      </div>
    </div>

    <div style="margin-top:16px;">
      <button class="btn-primary" id="btn-analyze" onclick="runAnalysis()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Analisar e buscar candidatos
      </button>
    </div>
  </div>

  <!-- PAGE 2: Loading -->
  <div class="page" id="page2">
    <div class="loader-wrap">
      <div class="loader-ring"></div>
      <p class="loader-text" id="loader-msg">Analisando requisitos da vaga...</p>
    </div>
  </div>

  <!-- PAGE 3: Results -->
  <div class="page" id="page3">
    <div class="result-header">
      <div>
        <p class="section-title" id="res-title">Candidatos encontrados</p>
        <p class="section-sub" style="margin-bottom:0;" id="res-sub"></p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn-secondary" onclick="exportXLS()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar .xlsx
        </button>
        <button class="btn-secondary" onclick="restart()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          Nova busca
        </button>
      </div>
    </div>

    <!-- Keywords -->
    <div class="card" id="kw-card" style="margin-bottom:12px;">
      <span class="field-label" style="margin-bottom:8px; display:block;">Competências identificadas</span>
      <div id="kw-tags"></div>
    </div>

    <!-- Boolean -->
    <div class="card" style="margin-bottom:20px;">
      <span class="field-label" style="margin-bottom:8px; display:block;">String booleana para o LinkedIn</span>
      <div class="boolean-box" id="bool-box">
        <button class="copy-btn" onclick="copyBoolean()">copiar</button>
        <span id="bool-text"></span>
      </div>
    </div>

    <!-- Profile list -->
    <div id="profiles"></div>
  </div>

</div>

<script>
  let resultData = null;
  const loadingMessages = [
    'Analisando requisitos da vaga...',
    'Identificando competências-chave...',
    'Gerando string booleana para LinkedIn...',
    'Simulando busca e ranqueando perfis...',
    'Calculando aderência dos candidatos...'
  ];

  function setPage(n) {
    document.querySelectorAll('.page').forEach((p,i) => p.classList.toggle('active', i === n-1));
    ['sd1','sd2','sd3'].forEach((id,i) => {
      const el = document.getElementById(id);
      el.className = 'step-dot' + (i < n-1 ? ' done' : i === n-1 ? ' active' : '');
    });
  }

  function cycleMessages(el, msgs, interval) {
    let i = 0;
    el.textContent = msgs[0];
    return setInterval(() => {
      i = (i + 1) % msgs.length;
      el.textContent = msgs[i];
    }, interval);
  }

  async function runAnalysis() {
    const jd = document.getElementById('jd').value.trim();
    if (jd.length < 30) { alert('Por favor, cole a descrição da vaga antes de continuar.'); return; }

    const qty = document.getElementById('qty').value;
    const loc = document.getElementById('loc').value.trim() || 'Brasil';

    setPage(2);
    const msgEl = document.getElementById('loader-msg');
    const interval = cycleMessages(msgEl, loadingMessages, 1800);

    const prompt = `Você é um especialista em recrutamento e talent acquisition. Com base na descrição de vaga abaixo, execute:

1. Extraia as competências técnicas e comportamentais principais (máximo 12).
2. Crie uma string de busca booleana otimizada para o LinkedIn (use AND, OR, parênteses e aspas para termos compostos).
3. Gere uma lista de exatamente ${qty} candidatos fictícios mas altamente realistas, com nomes brasileiros verossímeis. Cada candidato deve ter: nome completo, cargo atual, empresa atual, localização próxima de "${loc}", lista de 4-5 skills relevantes, uma pontuação de aderência à vaga (0-100) e um motivo curto de 1 frase. URLs de LinkedIn fictícias no formato https://linkedin.com/in/nome-sobrenome (use hífens, sem acento).

Responda SOMENTE com JSON válido, sem qualquer texto fora do JSON, sem markdown, sem blocos de código. Use exatamente esta estrutura:
{
  "cargo": "nome do cargo extraído",
  "keywords": ["k1","k2","k3"],
  "boolean_query": "string aqui",
  "candidates": [
    {
      "name": "Nome Sobrenome",
      "title": "Cargo Atual",
      "company": "Empresa",
      "location": "Cidade, UF",
      "skills": ["s1","s2","s3","s4"],
      "score": 90,
      "reason": "frase curta",
      "linkedin_url": "https://linkedin.com/in/nome-sobrenome"
    }
  ]
}

Descrição da vaga:
${jd}`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 2000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      clearInterval(interval);

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const raw = data.content.map(b => b.text || '').join('');
      const clean = raw.replace(/```json|```/g, '').trim();
      resultData = JSON.parse(clean);
      renderResults(resultData);
      setPage(3);
    } catch(e) {
      clearInterval(interval);
      msgEl.textContent = 'Erro ao processar. Verifique sua conexão e tente novamente.';
      console.error(e);
      setTimeout(() => setPage(1), 3000);
    }
  }

  function renderResults(d) {
    document.getElementById('res-title').textContent = d.cargo;
    document.getElementById('res-sub').textContent =
      `${d.candidates.length} perfis encontrados · ordenados por aderência`;

    document.getElementById('kw-tags').innerHTML =
      d.keywords.map(k => `<span class="tag">${k}</span>`).join('');

    document.getElementById('bool-text').textContent = d.boolean_query;

    const sorted = [...d.candidates].sort((a,b) => b.score - a.score);
    const colors = ['blue','green','amber','blue','green','amber','blue','green','amber','blue','green','green','amber','blue','green','amber','blue','green','amber','blue'];

    document.getElementById('profiles').innerHTML = sorted.map((c, i) => {
      const initials = c.name.split(' ').slice(0,2).map(n=>n[0].toUpperCase()).join('');
      const scoreClass = c.score >= 80 ? 'hi' : c.score >= 60 ? 'mid' : 'lo';
      const fillColor = c.score >= 80 ? '#30d158' : c.score >= 60 ? '#0a84ff' : '#ffd60a';
      const anim = `animation-delay: ${i * 0.06}s`;
      return `
      <div class="profile-card" style="${anim}">
        <div class="avatar ${colors[i % colors.length]}">${initials}</div>
        <div class="profile-info">
          <div class="profile-name">
            ${c.name}
            <a href="${c.linkedin_url}" class="li-link" target="_blank" rel="noopener">LinkedIn ↗</a>
          </div>
          <p class="profile-title">${c.title} · ${c.company} · ${c.location}</p>
          <p class="profile-reason">"${c.reason}"</p>
          <div>${c.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
        </div>
        <div class="score-wrap">
          <div class="score-num ${scoreClass}">${c.score}</div>
          <div class="score-bar"><div class="score-fill" style="width:${c.score}%; background:${fillColor};"></div></div>
          <div class="score-label">aderência</div>
        </div>
      </div>`;
    }).join('');
  }

  function copyBoolean() {
    const txt = document.getElementById('bool-text').textContent;
    navigator.clipboard.writeText(txt).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'copiado!';
      setTimeout(() => btn.textContent = 'copiar', 2000);
    });
  }

  function exportXLS() {
    if (!resultData) return;
    const rows = resultData.candidates
      .sort((a,b) => b.score - a.score)
      .map(c => ({
        'Nome': c.name,
        'Cargo Atual': c.title,
        'Empresa': c.company,
        'Localização': c.location,
        'Skills': c.skills.join(', '),
        'Aderência (%)': c.score,
        'Motivo': c.reason,
        'LinkedIn': c.linkedin_url
      }));

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [22,26,22,18,40,14,40,44].map(w => ({ wch: w }));

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Candidatos');

    const filename = `candidatos_${resultData.cargo.replace(/\s+/g,'_').toLowerCase()}.xlsx`;
    XLSX.writeFile(wb, filename);
  }

  function restart() {
    resultData = null;
    document.getElementById('jd').value = '';
    document.getElementById('loc').value = '';
    setPage(1);
  }
</script>
</body>
</html>
